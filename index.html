/* =====================================================================
   ALERTA VIVO — Urban Risk Intelligence Platform (protótipo funcional)
   SPA em JavaScript Vanilla. Regras de negócio RN01–RN09 implementadas
   nas funções calc(), kOf(), cOf(), MATRIX e nos fluxos do console.
   ===================================================================== */

/* ---------- Relógio simulado (cenário começa às 18:14) ---------- */
let T0 = Date.now();
const SIM_START = (18 * 60 + 14) * 60;
const simSec = () => SIM_START + Math.floor((Date.now() - T0) / 1000);
const simMin = () => Math.floor(simSec() / 60);
const M = (h, m) => h * 60 + m;
const hhmm = (m) => { m = ((Math.floor(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const rel = (m) => { const d = simMin() - m; if (d <= 0) return 'agora'; if (d < 60) return `há ${d} min`; const h = Math.floor(d / 60), r = d % 60; return `há ${h} h${r ? ' ' + r + ' min' : ''}`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);

/* ---------- Catálogos ---------- */

   REGRAS DE NEGÓCIO (RN01–RN07)
   ===================================================================== */
// RN03 — nível de risco a partir de R = S × E

// RN04 — corroboração K (fontes independentes; fonte oficial = 100; contestação −15)
const kOf = (e) => (e.oficial ? 100 : Math.max(0, [0, 50, 80, 100][Math.min(e.indep, 3)] - 15 * e.contest));
// RN04 — confiança C = 0,4F + 0,3K + 0,2A + 0,1Q (validação humana fixa C = 100)
const cOf = (e) => (e.validado ? 100 : Math.round(0.4 * e.F + 0.3 * kOf(e) + 0.2 * e.A + 0.1 * e.Q));
const confLevel = (c) => (c >= 75 ? 'Alta' : c >= 50 ? 'Média' : 'Baixa');
// RN07 — matriz de prioridade
const MATRIX = {
  'Crítico':  { 'Alta': 1, 'Média': 2, 'Baixa': 3 },

  'Moderado': { 'Alta': 3, 'Média': 4, 'Baixa': 4 },
  'Baixo':    { 'Alta': 4, 'Média': 5, 'Baixa': 5 },
};
function calc(e) {
  const R = e.S * e.E, rl = riskLevel(R), K = kOf(e), C = cOf(e), cl = confLevel(C);
  return { R, rl, K, C, cl, P: MATRIX[rl][cl] };
}

/* ---------- T03 — Lista de alertas ---------- */
function listData() {
  let arr = S.events.filter((e) => ACTIVE.includes(e.status) || (S.showClosed && e.status === 'Encerrado'));
  if (S.listTab === 'perto') arr = arr.filter((e) => distKm(e) <= 2);
  if (S.listTab === 'areas') arr = arr.filter(reachesArea);
  const f = S.listF;
  if (f.tipo !== 'todos') arr = arr.filter((e) => e.tipo === f.tipo);
  if (f.risco !== 'todos') arr = arr.filter((e) => calc(e).rl === f.risco);
  if (f.conf !== 'todos') arr = arr.filter((e) => (f.conf === 'Validado' ? e.validado : calc(e).cl === f.conf));
  arr.sort(S.listSort === 'prioridade'
    ? (a, b) => (a.status === 'Encerrado') - (b.status === 'Encerrado') || calc(a).P - calc(b).P || distKm(a) - distKm(b)
    : (a, b) => b.atualizado - a.atualizado);
  return arr;
}

          <p class="text-xs text-slate-500 mt-0.5">${esc(e.bairro)} · ${fmtKm(distKm(e))} · ${rel(e.atualizado)}</p></div>

    ${e.status === 'Em validação' ? '<div class="text-sm rounded-xl bg-amber-50 text-amber-900 px-3 py-2.5 flex gap-2"><i data-lucide="hourglass" class="w-5 h-5 shrink-0"></i><span><b>Em verificação.</b> A Defesa Civil está validando este registro. Ele ainda não gera notificação (RN07).</span></div>' : ''}

    <section class="rounded-2xl border-2 border-sky-200 bg-sky-50/60 p-3.5" aria-labelledby="oc">
      <div class="flex items-center justify-between"><h3 id="oc" class="text-sm font-bold flex items-center gap-1.5"><i data-lucide="fingerprint" class="w-4 h-4 text-sky-700"></i>Origem e confiança</h3>${seal(e, 'lg')}</div>
      <ul class="mt-2.5 space-y-1.5">${e.fontes.slice(0, 4).map((f) => `<li class="flex items-center gap-2 text-xs"><span class="w-6 h-6 rounded-lg grid place-items-center ${srcColor[f.t]}"><i data-lucide="${srcIcon[f.t]}" class="w-3.5 h-3.5"></i></span><span class="font-semibold">${esc(f.nome)}</span><span class="text-slate-500 truncate">· ${srcLabel[f.t]}</span></li>`).join('')}</ul>

    </section>

    <div class="relative rounded-2xl overflow-hidden h-36 border border-slate-200 map-bg" aria-label="Mini-mapa do evento">
      ${miniMap(e)}
    </div>

    <section class="rounded-2xl bg-white border border-slate-200 p-3.5"><h3 class="text-sm font-bold mb-1">O que está acontecendo</h3><p class="text-sm text-slate-700">${esc(e.resumo)}</p>
      <div class="mt-2 grid grid-cols-2 gap-2 text-[11px]"><div class="rounded-lg bg-slate-50 p-2"><b>Severidade</b><br>${esc(e.sevTxt)}</div><div class="rounded-lg bg-slate-50 p-2"><b>Exposição</b><br>${esc(e.expTxt)}</div></div></section>

    <section class="rounded-2xl bg-white border border-slate-200 p-3.5"><h3 class="text-sm font-bold mb-2 flex items-center gap-1.5"><i data-lucide="life-buoy" class="w-4 h-4 text-red-600"></i>O que fazer</h3>
      <ul class="space-y-1.5">${(RECS[e.tipo] || RECS.outro).map((r) => `<li class="text-sm flex gap-2"><i data-lucide="check" class="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>${r}</li>`).join('')}</ul>
      <div class="mt-3 grid grid-cols-2 gap-2"><a href="tel:199" class="py-2 rounded-xl bg-red-50 text-red-800 text-sm font-bold flex items-center justify-center gap-1.5"><i data-lucide="phone" class="w-4 h-4"></i>Defesa Civil 199</a><a href="tel:193" class="py-2 rounded-xl bg-red-50 text-red-800 text-sm font-bold flex items-center justify-center gap-1.5"><i data-lucide="phone" class="w-4 h-4"></i>Bombeiros 193</a></div></section>

    <section class="rounded-2xl bg-white border border-slate-200 p-3.5"><h3 class="text-sm font-bold mb-2">Linha do tempo do evento</h3>

        <div class="text-xs"><span class="font-mono font-bold">${hhmm(t.h)}</span> · <b>${t.s}</b></div>${t.t ? `<div class="text-xs text-slate-500">${esc(t.t)}</div>` : ''}</li>`).join('')}</ol></section>

    ${closed ? '' : `<section class="rounded-2xl bg-white border border-slate-200 p-3.5"><h3 class="text-sm font-bold">Você está vendo isso?</h3><p class="text-xs text-slate-500 mb-2">Sua resposta recalcula a corroboração (K) da confiança.</p>
      <div class="grid grid-cols-2 gap-2">
        <button ${voted ? 'disabled' : ''} onclick="A.vote('${e.id}','up')" class="py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-1.5 ${voted === 'up' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-800 ring-1 ring-emerald-200'} disabled:opacity-80"><i data-lucide="thumbs-up" class="w-4 h-4"></i>${voted === 'up' ? 'Confirmado por você' : 'Também estou vendo'}</button>
        <button ${voted ? 'disabled' : ''} onclick="A.vote('${e.id}','down')" class="py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-1.5 ${voted === 'down' ? 'bg-slate-700 text-white' : 'bg-slate-50 text-slate-700 ring-1 ring-slate-200'} disabled:opacity-80"><i data-lucide="thumbs-down" class="w-4 h-4"></i>${voted === 'down' ? 'Contestado' : 'Não está acontecendo'}</button>

  </div>`;
}
function miniMap(e) {
  return `<div class="absolute inset-0 overflow-hidden" data-mini="${e.id}"><div class="absolute mini-inner" style="width:300%;aspect-ratio:360/640">${mapBase({ areas: true, events: [e] })}${marker(e, 'A.noop')}${userDot()}</div></div>`;
}

/* ---------- T05 — Origem e nível de confiança do dado ---------- */
function viewT05() {
  const e = ev(S.selected) || S.events[0];
  const c = calc(e), s = sealInfo(e);
  const r = 70, circ = 2 * Math.PI * r, off = circ * (1 - c.C / 100);
  const gColor = e.validado ? '#4338ca' : c.cl === 'Alta' ? '#0369a1' : c.cl === 'Média' ? '#38bdf8' : '#94a3b8';
  const fac = [
    ['F', 'Confiabilidade da fonte', 0.4, e.F, e.fTxt, 'radio-tower'],
    ['K', 'Corroboração', 0.3, c.K, e.oficial ? 'Fonte oficial: corroboração máxima (K = 100)' : `${e.indep} fonte(s) independente(s) confirmam${e.contest ? ` · ${e.contest} contestação(ões) (−15 cada)` : ' · 0 contestações'}`, 'git-merge'],
    ['A', 'Atualidade', 0.2, e.A, e.aTxt, 'clock'],
    ['Q', 'Qualidade do registro', 0.1, e.Q, e.qTxt, 'scan-search'],
  ];
  const matrixRow = (lvl) => `<tr><th class="text-left py-1 pr-1 font-semibold whitespace-nowrap"><span class="inline-flex items-center gap-1">${shapeSvg(lvl, 10)}${lvl}</span></th>${['Alta', 'Média', 'Baixa'].map((cl) => { const hit = lvl === c.rl && cl === c.cl; return `<td class="text-center py-1"><span class="inline-block min-w-[34px] rounded-md px-1 py-0.5 font-mono font-bold ${hit ? 'bg-slate-900 text-white ring-2 ring-sky-400' : 'bg-slate-100 text-slate-500'}">P${MATRIX[lvl][cl]}</span></td>`; }).join('')}</tr>`;
  return `${backHeader('Origem e confiança do dado')}
  <div class="px-4 pt-3 pb-8 space-y-3 fade-in">
    <div class="text-xs text-slate-500 flex items-center gap-1.5">${typeIcon(e.tipo, 'w-4 h-4')}<span class="font-semibold text-slate-700 truncate">${esc(e.titulo)}</span></div>
    <section class="rounded-3xl bg-gradient-to-b from-sky-50 to-white border border-sky-100 p-4 text-center">
      <div class="relative mx-auto w-44 h-44">
        <svg viewBox="0 0 180 180" class="w-44 h-44 -rotate-90" aria-hidden="true"><circle cx="90" cy="90" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="16"/>
          <circle class="gauge-arc" id="gaugeArc" cx="90" cy="90" r="${r}" fill="none" stroke="${gColor}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-off="${off}"/></svg>
        <div class="absolute inset-0 grid place-items-center"><div><div class="text-5xl font-black tracking-tight" aria-label="Nota de confiança ${c.C} de 100">${c.C}</div><div class="text-xs text-slate-500 font-semibold">de 100</div></div></div>
      </div>
      <div class="mt-2 flex justify-center">${seal(e, 'lg')}</div>
      <p class="mt-2 text-[11px] text-slate-500">Alta ≥ 75 · Média 50–74 · Baixa &lt; 50 · Validado por agente = 100</p>
    </section>

    ${e.validado ? `<div class="rounded-2xl bg-indigo-50 border border-indigo-200 p-3 text-sm text-indigo-900 flex gap-2"><i data-lucide="badge-check" class="w-5 h-5 shrink-0"></i><span><b>Validado por agente da Defesa Civil</b> às ${hhmm(e.validadoEm)}. Por regra (RN04), a confiança passa a 100. O nome do agente não é exibido ao público.</span></div>` : ''}

    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <h3 class="text-sm font-bold">Como a nota foi calculada</h3>
      <p class="text-[11px] text-slate-500 mb-3">C = 0,4·F + 0,3·K + 0,2·A + 0,1·Q ${e.validado ? '(substituído por 100 após validação humana)' : ''}</p>
      <div class="space-y-3">${fac.map(([k, n, w, v, txt, ic]) => `<div>
        <div class="flex items-center justify-between text-xs"><span class="font-semibold flex items-center gap-1.5"><span class="w-5 h-5 rounded-md bg-slate-900 text-white text-[10px] font-mono font-bold grid place-items-center">${k}</span>${n} <span class="text-slate-400 font-normal">· peso ${w * 100}%</span></span>
          <span class="font-mono"><b>${v}</b> <span class="text-slate-400">→ +${(w * v).toFixed(1).replace('.', ',')} pts</span></span></div>
        <div class="mt-1 h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="bar-fill h-full rounded-full" style="width:0%;background:${gColor}" data-w="${v}"></div></div>
        <details class="mt-0.5"><summary class="text-[11px] text-sky-700 cursor-pointer select-none">Por quê?</summary><p class="text-[11px] text-slate-600 mt-0.5 flex gap-1"><i data-lucide="${ic}" class="w-3 h-3 shrink-0 mt-0.5"></i>${esc(txt)}</p></details></div>`).join('')}</div>
      <div class="mt-3 rounded-xl bg-slate-900 text-slate-100 font-mono text-[11px] px-3 py-2 overflow-x-auto whitespace-nowrap">0,4×${e.F} + 0,3×${c.K} + 0,2×${e.A} + 0,1×${e.Q} = <b class="text-white">${Math.round(0.4 * e.F + 0.3 * c.K + 0.2 * e.A + 0.1 * e.Q)}</b>${e.validado ? ' → <b class="text-indigo-300">100 (validado)</b>' : ''}</div>
    </section>

    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <h3 class="text-sm font-bold mb-2">De onde veio a informação <span class="text-slate-400 font-normal">(${e.fontes.length})</span></h3>
      <ul class="space-y-2">${e.fontes.map((f) => `<li class="rounded-xl border ${f.principal ? 'border-sky-300 bg-sky-50/50' : 'border-slate-200'} p-3 flex gap-3">
        <span class="w-10 h-10 rounded-xl grid place-items-center shrink-0 ${srcColor[f.t]}"><i data-lucide="${srcIcon[f.t]}" class="w-5 h-5"></i></span>
        <div class="min-w-0"><div class="flex flex-wrap items-center gap-1.5"><span class="font-bold text-sm">${esc(f.nome)}</span>${f.principal ? '<span class="text-[10px] font-bold uppercase bg-sky-700 text-white px-1.5 rounded">Principal</span>' : ''}${f.minha ? '<span class="text-[10px] font-bold uppercase bg-violet-600 text-white px-1.5 rounded">Você</span>' : ''}</div>
          <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">${srcLabel[f.t]}</div>
          <p class="text-xs text-slate-600 mt-0.5">${esc(f.det)}</p><p class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${hhmm(f.hora)} · ${rel(f.hora)}</p></div></li>`).join('')}</ul>
      ${e.contest ? `<p class="mt-2 text-xs text-slate-600 flex gap-1.5"><i data-lucide="thumbs-down" class="w-4 h-4"></i>${e.contest} morador(es) contestaram este evento.</p>` : ''}
    </section>

    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <h3 class="text-sm font-bold">Por que este evento é ${PRIO[c.P].txt}?</h3>
      <p class="text-[11px] text-slate-500 mb-2">Risco ${c.rl} (R = ${e.S} × ${e.E} = ${c.R}) × Confiança ${c.cl} → ${PRIO[c.P].desc}.</p>
      <table class="w-full text-[11px]"><thead><tr class="text-slate-500"><th></th><th class="font-semibold">Alta</th><th class="font-semibold">Média</th><th class="font-semibold">Baixa</th></tr></thead><tbody>${['Crítico', 'Alto', 'Moderado', 'Baixo'].map(matrixRow).join('')}</tbody></table>
      <p class="mt-2 text-[11px] text-slate-600 flex gap-1"><i data-lucide="info" class="w-3 h-3 shrink-0 mt-0.5"></i>Regra de ouro: confiança Baixa nunca gera notificação automática.</p>
    </section>

    <div class="rounded-2xl bg-slate-50 p-3 text-[11px] text-slate-600 flex gap-2"><i data-lucide="eye-off" class="w-4 h-4 shrink-0"></i>Dados pessoais de quem relatou não são exibidos (LGPD). Autores são pseudonimizados, fotos têm rostos e placas desfocados e a posição pública é arredondada em ~100 m.</div>
  </div>`;
}

/* ---------- T06 — Central de notificações ---------- */
function viewT06() {
  if (S.visitor) return pageHeader('Notificações') + visitorLock('receber notificações');
  const tabs = [['todas', 'Todas'], ['alerta', 'Alertas'], ['relato', 'Meus relatos'], ['sistema', 'Sistema']];
  const arr = S.notifs.filter((n) => S.notifTab === 'todas' || n.cat === S.notifTab);
  const unread = S.notifs.filter((n) => !n.lida).length;
  const item = (n) => {
    const e = n.eventId && ev(n.eventId); const c = e && calc(e);
    const icon = n.cat === 'relato' ? 'message-square-check' : n.cat === 'sistema' ? 'info' : TIPOS[e ? e.tipo : 'outro'].icon;
    const bg = c ? `background:${RISK[c.rl].hex};color:${RISK[c.rl].ink}` : n.cat === 'relato' ? 'background:#7c3aed;color:#fff' : 'background:#e2e8f0;color:#334155';
    return `<li><button onclick="A.openNotif('${n.id}')" class="w-full text-left px-4 py-3 flex gap-3 ${n.lida ? 'bg-white' : 'bg-sky-50/70'} hover:bg-slate-50 border-b border-slate-100">
      <span class="w-10 h-10 rounded-xl grid place-items-center shrink-0" style="${bg}"><i data-lucide="${icon}" class="w-5 h-5"></i></span>
      <span class="flex-1 min-w-0"><span class="flex items-center gap-2"><span class="font-bold text-sm ${n.lida ? 'text-slate-700' : ''} truncate">${esc(n.titulo)}</span>${!n.lida ? '<span class="w-2 h-2 rounded-full bg-sky-600 shrink-0" aria-label="não lida"></span>' : ''}</span>
        <span class="block text-xs text-slate-600 mt-0.5">${esc(n.texto)}</span>
        <span class="mt-1 flex flex-wrap items-center gap-1.5 text-[11px] text-slate-400">${hhmm(n.hora)}${n.upd ? ` · <span class="text-sky-700 font-semibold">+${n.upd} atualizações agrupadas (RN08)</span>` : ''}${e && n.cat === 'alerta' ? ' · ' + riskBadge(c.rl) : ''}</span></span></button></li>`;
  };
  return `${pageHeader('Notificações', `${unread} não lida(s)`, `<button onclick="A.go('T10')" class="p-2 rounded-full hover:bg-slate-100" aria-label="Preferências de notificação"><i data-lucide="settings" class="w-5 h-5"></i></button>`)}
  <div class="px-4 flex gap-1.5 overflow-x-auto no-scrollbar" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.notifTab === k}" onclick="A.set('notifTab','${k}')" class="shrink-0 px-3.5 py-1.5 rounded-full text-sm font-semibold ${S.notifTab === k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">${l}</button>`).join('')}</div>
  <div class="px-4 mt-2 flex justify-end"><button onclick="A.readAll()" class="text-xs font-semibold text-sky-700 flex items-center gap-1"><i data-lucide="check-check" class="w-4 h-4"></i>Marcar todas como lidas</button></div>
  <ul class="mt-1">${arr.length ? arr.map(item).join('') : '<li class="text-center text-sm text-slate-500 py-10">Nada por aqui.</li>'}</ul>
  <p class="px-5 py-4 text-[11px] text-slate-500">Você recebe no máximo 3 notificações por hora, exceto alertas P1. Horário de silêncio: ${S.prefs.silencio ? `${S.prefs.de}–${S.prefs.ate} (exceto Crítico)` : 'desativado'}.</p>`;
}

/* ---------- T07 — Registro comunitário de ocorrência ---------- */
function viewT07() {
  if (S.visitor) return backHeader('Relatar ocorrência', 'T02') + visitorLock('relatar ocorrências');
  const f = S.t07;
  const steps = ['Tipo', 'Local', 'Detalhes'];
  const stepper = `<ol class="flex items-center gap-2 px-4 pt-3" aria-label="Etapas">${steps.map((s, i) => `<li class="flex-1"><div class="h-1.5 rounded-full ${i + 1 <= f.step ? 'bg-sky-600' : 'bg-slate-200'}"></div><div class="mt-1 text-[11px] font-semibold ${i + 1 === f.step ? 'text-sky-700' : 'text-slate-400'}">${i + 1}. ${s}</div></li>`).join('')}</ol>`;
  let body = '';
  if (f.step === 1) {
    body = `<h2 class="text-lg font-bold">O que está acontecendo?</h2><p class="text-xs text-slate-500 mb-3">Toque em uma opção.</p>
    <div class="grid grid-cols-2 gap-2.5">${Object.keys(TIPOS).map((k) => `<button onclick="A.t07Tipo('${k}')" class="rounded-2xl border-2 ${f.tipo === k ? 'border-sky-600 bg-sky-50' : 'border-slate-200 bg-white'} p-4 text-left hover:border-sky-400">
      <span class="w-11 h-11 rounded-xl bg-slate-900 text-white grid place-items-center">${typeIcon(k, 'w-6 h-6')}</span><span class="block mt-2 font-bold text-sm">${TIPOS[k].nome}</span></button>`).join('')}</div>`;
  } else if (f.step === 2) {
    const lat = (-23.470 - f.pos.y * 0.000135).toFixed(4).replace('.', ','), lng = (-46.480 + f.pos.x * 0.000147).toFixed(4).replace('.', ',');
    const nb = Object.entries(BAIRROS).sort((a, b) => distU(a[1], f.pos) - distU(b[1], f.pos))[0][0];
    body = `<h2 class="text-lg font-bold">Onde?</h2><p class="text-xs text-slate-500 mb-2">Usamos seu GPS. Toque no mapa para ajustar o pino.</p>
    <div id="pinMap" class="relative h-64 rounded-2xl overflow-auto no-scrollbar border border-slate-200 map-bg">
      <div class="relative cursor-crosshair" style="width:200%;aspect-ratio:360/640" onclick="A.t07Pin(event,this)">${mapBase({ areas: false })}
        <span class="absolute -translate-x-1/2 -translate-y-full pointer-events-none" style="left:${(f.pos.x / 360) * 100}%;top:${(f.pos.y / 640) * 100}%"><svg width="34" height="44" viewBox="0 0 24 32" class="drop-shadow-lg" aria-label="Local do relato"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 32 12 32s12-11.2 12-20.1C24 5.3 18.6 0 12 0z" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg></span>
        ${userDot()}</div></div>
    <div class="mt-2 rounded-xl bg-slate-50 p-3 text-xs space-y-0.5"><div class="flex items-center gap-1.5 font-semibold"><i data-lucide="navigation" class="w-3.5 h-3.5 text-sky-700"></i>Próximo a ${nb}</div>
      <div class="text-slate-500 font-mono">${lat}, ${lng} · precisão ± 15 m</div>
      <div class="text-slate-500 flex items-center gap-1"><i data-lucide="eye-off" class="w-3 h-3"></i>No mapa público seu relato aparece arredondado em ~100 m.</div></div>`;
  } else {
    body = `<h2 class="text-lg font-bold">Detalhes <span class="text-sm font-normal text-slate-400">(opcional)</span></h2>
    <div class="mt-2"><div class="text-sm font-semibold mb-1">Intensidade</div><div class="grid grid-cols-3 gap-2">${[['leve', 'Leve'], ['moderada', 'Moderada'], ['grave', 'Grave']].map(([k, l]) => `<button onclick="A.t07Set('intensidade','${k}')" aria-pressed="${f.intensidade === k}" class="py-2.5 rounded-xl text-sm font-bold ${f.intensidade === k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">${l}</button>`).join('')}</div>
      <p class="text-[11px] text-slate-500 mt-1">Define a severidade inicial: Leve = S2, Moderada = S3, Grave = S4 (RN01).</p></div>
    <div class="mt-3"><div class="text-sm font-semibold mb-1">Foto</div>${f.foto
      ? `<div class="flex items-center gap-3 rounded-xl border border-emerald-200 bg-emerald-50 p-2"><div class="w-16 h-16 rounded-lg blur-photo"></div><div class="text-xs flex-1"><b>foto_relato.jpg</b><br><span class="text-emerald-700 flex items-center gap-1"><i data-lucide="scan-face" class="w-3.5 h-3.5"></i>Rostos e placas desfocados</span></div><button onclick="A.t07Set('foto',false)" class="p-2" aria-label="Remover foto"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`
      : `<button onclick="A.t07Set('foto',true)" class="w-full py-5 rounded-xl border-2 border-dashed border-slate-300 text-sm font-semibold text-slate-600 flex flex-col items-center gap-1"><i data-lucide="camera" class="w-6 h-6"></i>Adicionar foto<span class="text-[11px] font-normal">Rostos e placas serão desfocados automaticamente</span></button>`}</div>
    <div class="mt-3"><label for="desc" class="text-sm font-semibold">Descrição curta</label><textarea id="desc" maxlength="140" rows="2" oninput="S.t07.desc=this.value;$('descCount').textContent=this.value.length" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="Ex.: água cobrindo a calçada">${esc(f.desc)}</textarea><div class="text-right text-[11px] text-slate-400"><span id="descCount">${f.desc.length}</span>/140</div></div>`;
  }
  const canNext = f.step === 1 ? !!f.tipo : true;
  return `${backHeader('Relatar ocorrência', 'T02')}${stepper}
  <div class="px-4 pt-4 pb-4 fade-in">${body}</div>
  <div class="sticky bottom-0 bg-white border-t border-slate-100 p-3 flex gap-2">
    ${f.step > 1 ? `<button onclick="A.t07Step(-1)" class="px-4 py-3 rounded-xl bg-slate-100 font-semibold text-sm">Voltar</button>` : `<button onclick="A.go('T02')" class="px-4 py-3 rounded-xl bg-slate-100 font-semibold text-sm">Cancelar</button>`}
    ${f.step === 2 ? `<button onclick="A.submitReport()" class="px-3 py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm">Enviar agora</button>` : ''}
    ${f.step < 3 ? `<button ${canNext ? '' : 'disabled'} onclick="A.t07Step(1)" class="flex-1 py-3 rounded-xl bg-sky-700 text-white font-bold text-sm disabled:opacity-40">${f.step === 2 ? 'Adicionar detalhes' : 'Continuar'}</button>`
      : `<button onclick="A.submitReport()" class="flex-1 py-3 rounded-xl bg-sky-700 text-white font-bold text-sm flex items-center justify-center gap-1.5"><i data-lucide="send" class="w-4 h-4"></i>Enviar relato</button>`}
  </div>

}

/* ---------- T08 — Confirmação e acompanhamento do relato ---------- */
function viewT08() {
  if (S.visitor) return backHeader('Meu relato', 'T02') + visitorLock('acompanhar seus relatos');
  const r = S.reports.find((x) => x.id === S.lastReport);
  const hist = `<section class="rounded-2xl bg-white border border-slate-200 p-4"><h3 class="text-sm font-bold mb-2">Meus relatos</h3><ul class="divide-y divide-slate-100">${S.reports.map((x) => {
    const e = x.eventId && ev(x.eventId); const st = e ? e.status : x.statusFixo;
    return `<li class="py-2.5 flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-slate-100 grid place-items-center">${typeIcon(x.tipo, 'w-4 h-4')}</span><div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${TIPOS[x.tipo].nome} · ${esc(x.local)}</div><div class="text-[11px] text-slate-500 font-mono">#${x.protocolo} · ${x.data}</div></div>${statusChip(st)}</li>`;
  }).join('')}</ul></section>`;
  if (!r) {
    return `${backHeader('Meus relatos', 'T02')}<div class="p-4 space-y-3"><div class="rounded-2xl bg-sky-50 p-4 text-sm text-sky-900">Você ainda não enviou um relato nesta sessão.<button onclick="A.go('T07')" class="mt-3 w-full py-2.5 rounded-xl bg-sky-700 text-white font-bold">Registrar ocorrência</button></div>${hist}</div>`;
  }
  const e = ev(r.eventId);
  const st = e.status;
  const idx = st === 'Descartado' ? -1 : STATES.indexOf(st);
  const discardedAt = st === 'Descartado' ? Math.max(1, e.timeline.filter((t) => STATES.includes(t.s)).length - 1) : null;
  const tlTime = (s) => { if (s === 'Reportado' && r.merged) return hhmm(r.criadoMin); const t = [...e.timeline].reverse().find((x) => x.s === s); return t ? hhmm(t.h) : ''; };
  const labels = { 'Reportado': 'Recebido', 'Em validação': 'Em validação', 'Confirmado': 'Confirmado', 'Alerta emitido': 'Alerta emitido', 'Em monitoramento': 'Em monitoramento', 'Encerrado': 'Encerrado' };
  const descs = { 'Reportado': 'Seu relato chegou e foi pseudonimizado.', 'Em validação': 'Cruzando com sensores e outros relatos; agente da Defesa Civil revisa.', 'Confirmado': 'Ocorrência confirmada.', 'Alerta emitido': 'Vizinhos na área foram avisados.', 'Em monitoramento': 'Acompanhando a evolução.', 'Encerrado': 'Situação normalizada.' };
  const stepItem = (s, i) => {
    let state = 'todo';
    if (st === 'Descartado') state = i <= 1 ? 'done' : 'todo';
    else if (i < idx || (i === idx && s === 'Encerrado')) state = 'done';
    else if (i === idx) state = 'current';
    if (s === 'Alerta emitido' && e.semAlerta && idx > 3) state = 'skip';
    const dot = state === 'done' ? 'bg-emerald-500 text-white' : state === 'current' ? 'bg-sky-600 text-white ring-4 ring-sky-100' : state === 'skip' ? 'bg-slate-200 text-slate-400' : 'bg-white border-2 border-slate-300 text-slate-400';
    const icon = state === 'done' ? 'check' : state === 'current' ? 'loader' : state === 'skip' ? 'minus' : 'circle';
    return `<li class="relative pl-10 pb-4 last:pb-0"><span class="absolute left-0 top-0 w-7 h-7 rounded-full grid place-items-center ${dot}"><i data-lucide="${icon}" class="w-4 h-4 ${state === 'current' ? 'animate-spin' : ''}"></i></span>
      ${i < STATES.length - 1 ? `<span class="absolute left-[13px] top-7 bottom-0 w-0.5 ${state === 'done' ? 'bg-emerald-400' : 'bg-slate-200'}"></span>` : ''}
      <div class="text-sm font-bold ${state === 'todo' || state === 'skip' ? 'text-slate-400' : ''}">${labels[s]} <span class="font-mono text-[11px] text-slate-400 font-normal">${state === 'done' || state === 'current' ? tlTime(s) : ''}</span></div>
      <div class="text-xs ${state === 'todo' || state === 'skip' ? 'text-slate-400' : 'text-slate-600'}">${state === 'skip' ? 'Não aplicável: prioridade P4/P5 não gera push' : descs[s]}</div></li>`;
  };
  return `${backHeader('Meu relato', 'T02')}
  <div class="p-4 space-y-3 fade-in">
    <div class="rounded-3xl bg-gradient-to-br from-emerald-500 to-emerald-700 text-white p-5 text-center">
      <span class="mx-auto w-14 h-14 rounded-full bg-white/20 grid place-items-center"><i data-lucide="${st === 'Descartado' ? 'x' : 'check'}" class="w-8 h-8"></i></span>
      <h2 class="mt-2 text-xl font-extrabold">${st === 'Descartado' ? 'Relato analisado' : 'Relato recebido!'}</h2>
      <p class="text-sm opacity-90">Protocolo <span class="font-mono font-bold">#${r.protocolo}</span></p>
      ${r.merged ? `<p class="mt-2 text-xs bg-white/15 rounded-lg px-3 py-1.5 inline-flex items-center gap-1.5"><i data-lucide="git-merge" class="w-3.5 h-3.5"></i>Seu relato se juntou a ${e.fontes.filter((f) => !f.minha && f.t !== 'validacao').length} outra(s) fonte(s) sobre o mesmo local</p>` : ''}
    </div>
    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3"><h3 class="text-sm font-bold">Status (ciclo de vida do evento)</h3>${statusChip(st)}</div>
      ${st === 'Descartado' ? `<div class="mb-3 rounded-xl bg-slate-100 p-3 text-xs text-slate-700"><b>Descartado:</b> ${esc(e.motivo || 'não confirmado')}. Obrigado por colaborar — relatos ajudam a calibrar o sistema.</div>` : ''}
      <ol>${STATES.map(stepItem).join('')}</ol>
    </section>
    <section class="rounded-2xl bg-white border border-slate-200 p-4 flex items-center justify-between gap-2"><div><div class="text-xs text-slate-500">Confiança atual do evento</div><div class="text-sm font-semibold">${esc(e.titulo)}</div></div>${seal(e)}</section>
    <div class="grid grid-cols-2 gap-2"><button onclick="A.selectEvent('${e.id}',true)" class="py-3 rounded-xl bg-slate-100 font-bold text-sm flex items-center justify-center gap-1.5"><i data-lucide="map" class="w-4 h-4"></i>Ver no mapa</button>
      <button onclick="A.openEvent('${e.id}')" class="py-3 rounded-xl bg-sky-700 text-white font-bold text-sm">Ver alerta</button></div>
    ${hist}
  </div>`;
}

/* =====================================================================

function viewT09() {
  const isDef = S.cRole === 'defesa';
  const queue = S.events.filter((e) => ['Em validação', 'Confirmado'].includes(e.status)).sort((a, b) => calc(a).P - calc(b).P || (a.filaDesde || 0) - (b.filaDesde || 0));
  const active = S.events.filter((e) => ['Alerta emitido', 'Em monitoramento'].includes(e.status));
  const tabs = [['fila', 'Fila de validação', 'list-checks', queue.length, isDef], ['ativos', 'Eventos ativos', 'activity', active.length, isDef], ['interrupcoes', 'Interrupções', 'zap-off', null, true], ['indicadores', 'Indicadores', 'bar-chart-3', null, true], ['auditoria', 'Auditoria', 'file-lock', null, isDef]];
  if (!tabs.find((t) => t[0] === S.cTab)[4]) S.cTab = 'interrupcoes';
  let body = '';
  if (S.cTab === 'fila') body = consoleFila(queue);
  else if (S.cTab === 'ativos') body = consoleAtivos(active);
  else if (S.cTab === 'interrupcoes') body = consoleInterrupcoes();
  else if (S.cTab === 'indicadores') body = consoleIndicadores();
  else body = consoleAuditoria();
  return `<div class="rounded-2xl bg-white shadow-xl border border-slate-200 overflow-hidden fade-in">
    <div class="bg-slate-900 text-white px-5 py-3 flex flex-wrap items-center gap-3">

      <div><div class="font-extrabold leading-tight">Alerta Vivo · Console Operacional</div><div class="text-[11px] text-slate-400">Sala de situação · Zona Leste · <span id="consoleClock" class="font-mono">18:14</span> · dados ao vivo <span id="syncStamp2">há 40 s</span></div></div>
      <div class="ml-auto flex items-center gap-2">
        <label class="text-[11px] text-slate-400" for="roleSel">Perfil (RBAC)</label>

        <span class="text-[11px] px-2 py-1 rounded-md bg-emerald-600/20 text-emerald-300 font-semibold flex items-center gap-1"><i data-lucide="key-round" class="w-3 h-3"></i>MFA ativo</span>
        <button onclick="A.go('T06')" class="text-sm px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 flex items-center gap-1.5"><i data-lucide="smartphone" class="w-4 h-4"></i>App do cidadão</button>
      </div>
    </div>
    <nav class="flex gap-1 px-4 pt-3 border-b border-slate-200 overflow-x-auto" role="tablist">${tabs.map(([k, l, ic, n, ok]) => `<button role="tab" aria-selected="${S.cTab === k}" ${ok ? `onclick="A.cTab('${k}')"` : 'disabled title="Sem permissão para este perfil (RBAC)"'} class="px-3.5 py-2.5 text-sm font-semibold flex items-center gap-1.5 border-b-2 -mb-px ${S.cTab === k ? 'border-sky-600 text-sky-700' : 'border-transparent text-slate-500 hover:text-slate-800'} ${ok ? '' : 'opacity-40 cursor-not-allowed'}"><i data-lucide="${ok ? ic : 'lock'}" class="w-4 h-4"></i>${l}${n != null ? `<span class="ml-1 text-[11px] px-1.5 rounded-full ${S.cTab === k ? 'bg-sky-100' : 'bg-slate-100'}">${n}</span>` : ''}</button>`).join('')}</nav>
    <div class="p-4">${body}</div>
  </div>`;
}
function consoleMap(list, h = 'h-[560px]') {
  return `<div class="relative ${h} rounded-xl overflow-auto thin-scroll border border-slate-200 map-bg"><div class="relative w-full" style="aspect-ratio:360/640">${mapBase({ areas: false, events: list })}${list.map((e) => marker(e, 'A.cSelect')).join('')}</div></div>`;
}
function factorMini(e) {
  const c = calc(e);
  return `<div class="grid grid-cols-4 gap-1.5 text-center">${[['F', e.F], ['K', c.K], ['A', e.A], ['Q', e.Q]].map(([k, v]) => `<div class="rounded-lg bg-slate-50 py-1"><div class="text-[10px] text-slate-500 font-bold">${k}</div><div class="font-mono text-sm font-bold">${v}</div></div>`).join('')}</div>`;
}
function queueCard(e) {
  const c = calc(e);
  const dl = e.status === 'Em validação' && e.filaDesde != null && PRAZO[c.P] ? e.filaDesde + PRAZO[c.P] : null;

    ? `<button onclick="event.stopPropagation();A.validate('${e.id}')" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold flex items-center gap-1.5"><i data-lucide="check" class="w-4 h-4"></i>Validar</button>
       <button onclick="event.stopPropagation();A.discard('${e.id}')" class="px-3 py-2 rounded-lg border border-red-300 text-red-700 hover:bg-red-50 text-sm font-bold flex items-center gap-1.5"><i data-lucide="x" class="w-4 h-4"></i>Descartar</button>
       <button onclick="event.stopPropagation();A.mergeDlg('${e.id}')" class="px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-semibold flex items-center gap-1.5"><i data-lucide="git-merge" class="w-4 h-4"></i>Mesclar</button>`
    : `<button onclick="event.stopPropagation();A.emitDlg('${e.id}')" class="px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-bold flex items-center gap-1.5"><i data-lucide="megaphone" class="w-4 h-4"></i>Emitir alerta</button>
       <button onclick="event.stopPropagation();A.keepMap('${e.id}')" class="px-3 py-2 rounded-lg border border-slate-300 text-sm font-semibold">Manter só no mapa</button>`;
  return `<article onclick="A.cSelect('${e.id}')" class="rounded-xl border ${isSel ? 'border-sky-500 ring-2 ring-sky-200' : 'border-slate-200'} bg-white p-4 shadow-sm cursor-pointer">
    <div class="flex items-start gap-3">${prioChip(c.P, true)}
      <div class="flex-1 min-w-0"><div class="flex items-center gap-2">${typeIcon(e.tipo, 'w-4 h-4 text-slate-500')}<h3 class="font-bold truncate">${esc(e.titulo)}</h3>${e.status === 'Confirmado' ? statusChip('Confirmado') : ''}</div>
        <p class="text-xs text-slate-500">${esc(e.local)} · ${esc(e.bairro)} · ${originSummary(e)} · na fila ${rel(Math.floor((e.filaDesde || simSec()) / 60))}</p></div>
      ${dl ? `<div class="text-right shrink-0"><div class="text-[10px] uppercase font-bold text-slate-500">Prazo RN07</div><div class="font-mono font-bold text-lg" data-deadline="${dl}">--:--</div></div>` : `<div class="text-right text-[10px] text-slate-500 shrink-0 font-semibold uppercase">${e.status === 'Confirmado' ? 'Aguardando<br>emissão' : 'Sem prazo<br>(rotina P4/P5)'}</div>`}
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-2">${riskBadge(c.rl)}${seal(e)}<span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-100">R = ${e.S}×${e.E} = ${c.R}</span><span class="text-[11px] text-slate-500">→ ${PRIO[c.P].desc}</span></div>
    <div class="mt-3 grid md:grid-cols-[1fr_200px] gap-3 items-start"><p class="text-sm text-slate-700">${esc(e.resumo)}</p>${factorMini(e)}</div>
    ${e.fotos ? `<div class="mt-3 flex gap-2">${Array.from({ length: e.fotos }).map(() => '<div class="w-20 h-14 rounded-lg blur-photo relative"><span class="absolute bottom-0.5 right-1 text-[9px] text-white font-bold bg-black/40 px-1 rounded">desfocada</span></div>').join('')}</div>` : ''}
    <div class="mt-3 flex flex-wrap gap-2">${actions}</div>
  </article>`;
}
function consoleFila(queue) {
  if (S.cRole !== 'defesa') return rbacLock();
  return `<div class="grid lg:grid-cols-[minmax(300px,380px)_1fr] gap-4">

    if (!cands.length) { toast('Nenhum evento do mesmo tipo para mesclar', 'warn'); return; }
    modal(`<h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="git-merge" class="w-5 h-5"></i>Mesclar com…</h2><p class="text-sm text-slate-500">As fontes de "${esc(e.titulo)}" serão anexadas ao evento escolhido (corroboração +1).</p>
      <select id="mergeTo" class="mt-3 w-full rounded-xl border border-slate-300 px-3 py-2.5">${cands.map((c) => `<option value="${c.id}">${c.id} · ${esc(c.titulo)} (${fmtKm((distU(c, e) * UNIT_M) / 1000)})</option>`).join('')}</select>
      <div class="mt-5 flex gap-2"><button onclick="A.closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-semibold">Cancelar</button><button onclick="A.doMerge('${id}')" class="flex-1 py-2.5 rounded-xl bg-slate-900 text-white font-bold">Mesclar</button></div>`);
  },
  doMerge(id) {
    const e = ev(id), t = ev($('mergeTo').value), before = calc(t).C;
    t.indep += 1; t.S = Math.max(t.S, e.S); t.fontes.push(...e.fontes.map((f) => ({ ...f, principal: false })));
    tl(t, 'Atualização', `Mesclado com ${e.id} · C ${before} → ${calc(t).C}`);
    e.status = 'Descartado'; e.motivo = 'Mesclado com ' + t.id; tl(e, 'Descartado', 'Mesclado com ' + t.id);
    S.reports.forEach((r) => { if (r.eventId === e.id) r.eventId = t.id; });
    addAudit('Sgt. Ricardo Almeida · agt_031', 'Mesclou eventos', `${e.id}→${t.id}`, 'Duplicidade');
    A.closeModal(); S.cSel = t.id; render(); toast(`Mesclado em ${t.id}`, 'ok');
  },
  emitDlg(id) {
    const e = ev(id), c = calc(e), reach = Math.round(e.raio * e.E * 41 + 300);
    modal(`<h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="megaphone" class="w-5 h-5 text-red-600"></i>Emitir alerta ${PRIO[c.P].txt}</h2>
      <div class="mt-3 rounded-xl bg-slate-100 p-3"><div class="text-[11px] text-slate-500 mb-1">Prévia da notificação</div><div class="rounded-xl bg-white p-3 shadow-sm"><b class="text-sm">${TIPOS[e.tipo].nome} · risco ${c.rl}</b><div class="text-xs text-slate-600">${esc(e.titulo)} · ${sealInfo(e).label}</div></div></div>
      <ul class="mt-3 text-sm space-y-1 text-slate-700"><li>• Alcance estimado: <b>≈ ${reach.toLocaleString('pt-BR')} pessoas</b> com área monitorada que intersecta o evento</li><li>• Canais: push${c.P === 1 ? ' + SMS (ignora silêncio)' : ''}</li><li>• Anti-spam aplicado (RN08)</li></ul>
      <div class="mt-5 flex gap-2"><button onclick="A.closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-semibold">Cancelar</button><button onclick="A.doEmit('${id}',${reach})" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold">Emitir agora</button></div>`);
  },
  doEmit(id, reach) {
    const e = ev(id), c = calc(e);
    e.status = 'Alerta emitido'; tl(e, 'Alerta emitido', `${PRIO[c.P].txt}: push para ≈ ${reach.toLocaleString('pt-BR')} pessoas`);
    addAudit('Sgt. Ricardo Almeida · agt_031', 'Emitiu alerta ' + PRIO[c.P].txt, id, `Alcance ≈ ${reach}`);
    A.closeModal(); render();
    if (reachesMarina(e)) pushNotif({ cat: 'alerta', titulo: `${TIPOS[e.tipo].nome} · risco ${c.rl} a ${fmtKm(distKm(e))}`, texto: `${e.titulo} · ${sealInfo(e).label}.`, eventId: e.id });
    else toast('Alerta emitido', 'ok');
    setTimeout(() => { if (e.status === 'Alerta emitido') { e.status = 'Em monitoramento'; tl(e, 'Em monitoramento', 'Notificações despachadas'); render(); } }, 1800);
  },
  keepMap(id) { const e = ev(id); e.status = 'Em monitoramento'; e.semAlerta = true; tl(e, 'Em monitoramento', 'Agente optou por manter só no mapa'); addAudit('Sgt. Ricardo Almeida · agt_031', 'Manteve sem alerta', id, 'Decisão do agente'); render(); },
  closeDlg(id) {
    const e = ev(id);
    modal(`<h2 class="text-lg font-bold">Encerrar "${esc(e.titulo)}"</h2><p class="text-sm text-slate-500">Condição de encerramento (RN09):</p>
      <select id="motivo" class="mt-3 w-full rounded-xl border border-slate-300 px-3 py-2.5"><option>Normalizado: sensores com S ≤ 1 por 30 min</option><option>Fonte oficial informou normalização</option><option>Encerramento manual após vistoria</option></select>
      <textarea id="just" rows="2" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="Justificativa">Vistoria concluída pela equipe de campo.</textarea>
      <div class="mt-5 flex gap-2"><button onclick="A.closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-semibold">Cancelar</button><button onclick="A.doClose('${id}')" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Encerrar evento</button></div>`);
  },
  doClose(id) {
    const e = ev(id), motivo = $('motivo').value, just = $('just').value;
    const reached = reachesMarina(e);
    e.status = 'Encerrado'; tl(e, 'Encerrado', motivo);
    addAudit('Sgt. Ricardo Almeida · agt_031', 'Encerrou evento', id, motivo + (just ? ' · ' + just : ''));
    A.closeModal(); render();
    if (reached) pushNotif({ cat: 'sistema', titulo: 'Situação normalizada', texto: e.titulo + ' foi encerrado.', eventId: e.id });
    else toast('Evento encerrado', 'ok');
  },
  intSet(k, v) { S.intForm[k] = v; const p = $('intPreview'); if (p) { p.innerHTML = intPreview(); icons(); } },
  publishInt() {
    const f = S.intForm, b = BAIRROS[f.bairro], n = Number(f.clientes) || 0;
    const sev = sevClientes(n, f.hosp), nomes = { energia: 'Interrupção de energia', agua: 'Falta de água', transporte: 'Interrupção no transporte' };
    const id = 'E' + S.eventSeq++;
    const e = { id, tipo: f.servico, titulo: `${nomes[f.servico]} — ${f.bairro}`, local: 'Área publicada pela operadora', bairro: f.bairro, x: b.x + 6, y: b.y + 6, raio: 40,
      S: sev, sevTxt: `S${sev} · ${f.hosp ? 'afeta hospital' : n.toLocaleString('pt-BR') + ' afetados'}`, E: b.E, expTxt: `E${b.E} · ${b.nota}`,
      F: 95, fTxt: 'Fonte oficial: centro de operações da concessionária', indep: 0, contest: 0, oficial: true, A: 100, aTxt: 'Publicado agora', Q: 100, qTxt: 'Registro oficial completo',
      status: 'Reportado', criado: simMin(), atualizado: simMin(), validado: false, retorno: f.retorno, clientes: n, operador: true,
      resumo: `${nomes[f.servico]} desde ${f.inicio}. ${n.toLocaleString('pt-BR')} afetados. Previsão de retorno: ${f.retorno}.`,
      fontes: [{ t: 'oficial', nome: 'Concessionária — COI', det: `Publicado por Juliana Torres (operadora) · retorno ${f.retorno}`, hora: simMin(), principal: true }], timeline: [] };
    tl(e, 'Reportado', 'Interrupção publicada pela operadora');
    const c = calc(e);
    tl(e, 'Em validação', `R = ${e.S} × ${e.E} = ${c.R} (${c.rl}) · C = ${c.C}`);
    tl(e, 'Confirmado', 'Fonte oficial (K = 100)');
    S.events.push(e);
    addAudit('Juliana Torres · opr_112', 'Publicou interrupção de serviço', id, `${n} afetados · retorno ${f.retorno}`);
    if (c.P <= 3) {
      e.status = 'Alerta emitido'; tl(e, 'Alerta emitido', `${PRIO[c.P].txt}: push automático (fonte oficial)`);
      render();
      if (reachesMarina(e)) pushNotif({ cat: 'alerta', titulo: `${nomes[f.servico]} na sua área`, texto: `${f.bairro} · retorno previsto ${f.retorno} · Confiança Alta.`, eventId: id });
      else toast(`Publicado e alertado (${PRIO[c.P].txt})`, 'ok');
      setTimeout(() => { if (e.status === 'Alerta emitido') { e.status = 'Em monitoramento'; tl(e, 'Em monitoramento', 'Notificações despachadas'); render(); } }, 1800);
    } else { e.status = 'Em monitoramento'; e.semAlerta = true; tl(e, 'Em monitoramento', `${PRIO[c.P].txt}: apenas mapa`); render(); toast(`Publicado (${PRIO[c.P].txt}: sem push)`, 'ok'); }
  },
  /* Barra de demonstração */
  demoPush() {
    const e = ev('E1'); if (!e || !ACTIVE.includes(e.status)) { toast('Evento E1 não está ativo'); return; }
    e.atualizado = simMin(); tl(e, 'Atualização', 'Chuva se mantém em 55 mm/h; córrego a 92% da cota');
    pushNotif({ cat: 'alerta', titulo: 'Alagamento CRÍTICO a 340 m', texto: 'Av. Marechal Tito · Confiança Alta (' + calc(e).C + ') · evite a região.', eventId: 'E1' });
  },
  demoNewReport() {
    const id = 'E' + S.eventSeq++;
    const e = { id, tipo: 'alagamento', titulo: 'Alagamento — Av. Pires do Rio', local: 'Av. Pires do Rio, 1.800', bairro: 'São Miguel Paulista', x: 245, y: 300, raio: 22,
      S: 3, sevTxt: 'S3 · intensidade "moderada" informada', E: 2, expTxt: 'E2 · densidade média', F: 45, fTxt: 'Relato comunitário: reputação do autor = 45', indep: 0, contest: 0, A: 100, aTxt: 'Relato de agora', Q: 40, qTxt: 'Somente GPS e foto parcial',
      status: 'Em validação', criado: simMin(), atualizado: simMin(), validado: false, filaDesde: simSec(), fotos: 1,
      resumo: '"Bueiro transbordando, água subindo na pista da direita."', fontes: [{ t: 'comunidade', nome: 'Relato de morador', det: 'Autor anônimo · GPS ± 40 m', hora: simMin(), principal: true }], timeline: [] };
    tl(e, 'Reportado', 'Relato comunitário recebido'); const c = calc(e); tl(e, 'Em validação', `R = ${c.R} (${c.rl}) · C = ${c.C} (${c.cl}) → ${PRIO[c.P].txt}`);
    S.events.push(e); addAudit('Sistema · LGPD', 'Pseudonimizou relato', id, 'Autor → psd_91be44');
    render(); toast(`Novo relato na fila: ${id} (${PRIO[c.P].txt}, C = ${c.C})`, 'ok');
  },
  reset() { T0 = Date.now(); S = seed(); seedAudit(); $('pushLayer').innerHTML = ''; A.closeModal(); render(); toast('Dados reiniciados'); },
  toggleDemo() { S.demoHidden = !S.demoHidden; document.body.classList.toggle('demo-hidden', S.demoHidden); $('demoBar').classList.toggle('hidden', S.demoHidden); $('demoShow').classList.toggle('hidden', !S.demoHidden); document.querySelector('main').classList.toggle('pt-16', !S.demoHidden); document.querySelector('main').classList.toggle('pt-4', S.demoHidden); },
};
window.A = A;

/* ---------- Relógio, carimbo de atualização e prazos (1 s) ---------- */
function tick() {
  const now = Date.now();
  let secs = Math.floor((now - S.lastSync) / 1000);
  if (secs >= 45) { S.lastSync = now; secs = 0; }
  const label = secs < 3 ? 'atualizado agora' : `há ${secs} s`;
  const s1 = $('syncStamp'); if (s1) s1.textContent = label;
  const s2 = $('syncStamp2'); if (s2) s2.textContent = label;
  $('simClock').textContent = hhmm(simMin());
  const cc = $('consoleClock'); if (cc) cc.textContent = hhmm(simMin());
  document.querySelectorAll('[data-deadline]').forEach((el) => {
    const left = Number(el.dataset.deadline) - simSec();
    if (left <= 0) { el.textContent = 'Escalado'; el.className = 'font-bold text-xs text-white bg-red-600 rounded px-1.5 py-0.5'; el.title = 'Prazo estourado: escalado ao coordenador (RN09)'; }
    else { el.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`; el.classList.toggle('text-red-600', left < 120); }
  });
}
setInterval(tick, 1000);

/* ---------- Atalhos de teclado ---------- */
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { '1': 'T01', '2': 'T02', '3': 'T03', '4': 'T04', '5': 'T05', '6': 'T06', '7': 'T07', '8': 'T08', '9': 'T09', '0': 'T10' };
  if (map[e.key]) go(map[e.key]);
  else if (e.key === 'd' || e.key === 'D') A.toggleDemo();
  else if (e.key === 'Escape') A.closeModal();
});

render();
</script>
</body>
</html>
